upstream django_app {
  server django:8080;
}

server {
    listen 443 ssl;
    server_name dreamplast.uz www.dreamplast.uz;
    
    location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
    }

    ssl_certificate /etc/letsencrypt/live/dreamplast.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dreamplast.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}

server {
    listen 80;
    server_name dreamplast.uz www.dreamplast.uz;
    return 301 https://$host$request_uri;
}
