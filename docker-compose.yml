version: '3'

volumes:
  postgres_data: { }

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:cached
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    command: /start

  postgres:
    image: postgres:14.5-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data:cached
    env_file:
      - ./.env

  redis:
    image: redis:6

  celeryworker:
    <<: *django
    image: celeryworker
    ports: [ ]
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: celerybeat
    ports: [ ]
    command: /start-celerybeat